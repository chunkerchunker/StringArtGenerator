<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Art Generator</title>
    <link rel="stylesheet" href="stringart.css">
</head>

<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <h1>🧵 String Art Generator</h1>

            <div class="controls">
                <div class="control-group">
                    <label>Input Mode:</label>
                    <div class="toggle-switch-container">
                        <span class="toggle-label">📁 Static Image</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="modeToggle" onchange="toggleInputMode()">
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="toggle-label">📹 Webcam</span>
                    </div>
                </div>

                <div class="control-group" id="imageInputGroup">
                    <label for="imageInput">Choose Image:</label>
                    <label for="imageInput" class="file-input-wrapper">
                        <input type="file" id="imageInput" accept="image/*">
                        <span id="fileInputText">Select Image File</span>
                    </label>
                </div>

                <div class="control-group" id="webcamGroup" style="display: none;">
                    <label>Webcam:</label>
                    <div style="display: flex; gap: 10px;">
                        <button id="startWebcamBtn" onclick="startWebcam()"
                            style="flex: 1; padding: 10px; border-radius: 4px; background: #2196F3; color: white; border: none; cursor: pointer;">
                            Start Webcam
                        </button>
                        <button id="stopWebcamBtn" onclick="stopWebcam()"
                            style="flex: 1; padding: 10px; border-radius: 4px; background: #f44336; color: white; border: none; cursor: pointer; display: none;">
                            Stop Webcam
                        </button>
                    </div>
                    <video id="webcamVideo" autoplay playsinline style="display: none;"></video>
                    <canvas id="webcamCanvas"
                        style="width: 100%; border-radius: 4px; margin-top: 10px; display: none;"></canvas>

                    <div style="margin-top: 15px;">
                        <label for="webcamContrast">Contrast:</label>
                        <input type="range" id="webcamContrast" min="0" max="200" value="100" step="5">
                        <div class="range-value" id="webcamContrastValue">100</div>
                    </div>
                </div>

                <div class="control-group">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="cropToFace">
                        <span>Crop to Face</span>
                    </label>
                </div>

                <div class="control-group">
                    <label for="targetSize">Processing Size:</label>
                    <input type="range" id="targetSize" min="50" max="1000" value="500" step="50">
                    <div class="range-value" id="targetSizeValue">500</div>
                </div>

                <div class="control-group">
                    <label for="pins">Pins:</label>
                    <input type="range" id="pins" min="50" max="500" value="300">
                    <div class="range-value" id="pinsValue">300</div>
                </div>

                <div class="control-group">
                    <label for="maxLines">Max Lines:</label>
                    <input type="range" id="maxLines" min="50" max="10000" value="4000" step="50">
                    <div class="range-value" id="maxLinesValue">4000</div>
                </div>

                <div class="control-group">
                    <label for="minDistance">Min Distance:</label>
                    <input type="range" id="minDistance" min="10" max="100" value="10">
                    <div class="range-value" id="minDistanceValue">10</div>
                </div>

                <div class="control-group">
                    <label for="lineWeight">Line Weight:</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="range" id="lineWeight" min="1" max="200" value="8" style="flex: 1;">
                        <div class="range-value" id="lineWeightValue" style="min-width: 40px;">8</div>
                        <label style="display: flex; align-items: center; gap: 5px; margin: 0;">
                            <input type="checkbox" id="autoLineWeight">
                            <span>Auto</span>
                        </label>
                    </div>
                </div>

                <div class="control-group">
                    <label for="renderLineWidth">Line Opacity:</label>
                    <input type="range" id="renderLineWidth" min="1" max="60" value="3" step="1">
                    <div class="range-value" id="renderLineWidthValue">3</div>
                </div>

            </div>

            <div class="auto-regenerate-section" style="text-align: center; margin: 20px 0;">
                <label
                    style="display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: #555;">
                    <input type="checkbox" id="autoRegenerate" checked style="transform: scale(1.2);">
                    Auto-regenerate on parameter changes
                </label>
            </div>

            <button class="generate-btn" id="generateBtn" onclick="generateStringArt()">
                Generate String Art
            </button>

            <div class="status" id="status" style="display: none;"></div>
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
                    <span id="toggleIcon">◀</span>
                </button>
                <button class="tab active" onclick="switchTab('original')">Original Image</button>
                <button class="tab" onclick="switchTab('result')">String Art Result</button>
            </div>

            <div class="tab-content active" id="originalTab">
                <div class="empty-state" id="originalEmpty">
                    Select an image file to preview
                </div>
            </div>

            <div class="tab-content" id="resultTab">
                <div class="empty-state" id="resultEmpty">
                    Generated string art will appear here
                </div>
            </div>
        </div>
    </div>

    <script src="stringart.js" type="module"></script>
</body>

</html>
